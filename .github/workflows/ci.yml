name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: molokh_test
          POSTGRES_USER: molokh
          POSTGRES_PASSWORD: local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U molokh -d molokh_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_TEST_URL: postgres://molokh:local-only-password@localhost:5432/molokh_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify code and database integration
        run: pnpm check
      - name: Verify the canonical Core specification
        shell: pwsh
        run: ./tools/validate-spec.ps1
