packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
allowBuilds:
  dtrace-provider: false
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-router@57.0.19

overrides:
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.11
  query-string>decode-uri-component: 0.5.0
  xcode>uuid: 11.1.1
