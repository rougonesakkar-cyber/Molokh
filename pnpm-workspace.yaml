  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-router@57.0.19
  - ip-address@10.7.3
  - compression@1.8.2
  - source-map-js@1.2.2

overrides:
